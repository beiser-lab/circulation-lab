name: Report a bug
description: Report unexpected behavior or a physiology concern.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve Circulation Lab. This report will be public. Please check existing issues before submitting."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem, including any unexpected physiology or graph behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and simulator settings
      description: Include starting scenario, intervention volume/rate, autonomic controls, ventricular properties, and when the problem appeared. Note whether you reset first.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g., Safari on Mac, Chrome on Windows, iPad
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or exported CSV (optional)
      description: Attach a screenshot or simulator CSV if helpful. Include the date/time of the experiment if known.
